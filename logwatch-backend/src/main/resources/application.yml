server:
  port: 8080

spring:
  application:
    name: logwatch-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/logwatch
    username: logwatch
    password: logwatch
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

logwatch:
  api:
    key: logwatch-dev-key
    key-enabled: true
  rule-engine:
    interval-ms: 30000

logging:
  level:
    com.logwatch: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
